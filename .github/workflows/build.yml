name: Build A11 XNU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Fix availability
        run: |
          # 强行把咱们本地编译好的 availability.pl 复制过去
          SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p $SDKROOT/usr/local/libexec
          cp availability.pl $SDKROOT/usr/local/libexec/
          chmod +x $SDKROOT/usr/local/libexec/availability.pl
          
          # 创建假的 availability 执行文件，防止它报错
          echo '#!/bin/bash' > $SDKROOT/usr/local/libexec/availability
          echo 'exit 0' >> $SDKROOT/usr/local/libexec/availability
          chmod +x $SDKROOT/usr/local/libexec/availability

      - name: Build XNU
        run: |
          make SDKROOT=macosx ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=DEVELOPMENT MACHINE_CONFIGS=BCM2837 RC_DARWIN_KERNEL_VERSION=23.6.0 RC_ProjectSourceVersion=10063.141.1

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel.development
          path: BUILD/obj/kernel.development
