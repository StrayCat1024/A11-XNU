name: Build A11 XNU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install official Availability tools and Map DriverKit Headers
        run: |
          set -e
          
          # 1. 安装 AvailabilityVersions 工具链
          SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p "$SDKROOT/usr/local/libexec"
          cp SETUP/availability/availability.pl "$SDKROOT/usr/local/libexec/"
          cp SETUP/availability/availability "$SDKROOT/usr/local/libexec/"
          cp SETUP/availability/availability.dsl "$SDKROOT/usr/local/libexec/"
          chmod +x "$SDKROOT/usr/local/libexec/availability.pl"
          chmod +x "$SDKROOT/usr/local/libexec/availability"

          # 2. 自动映射 DriverKit 缺失的头文件（从整个源码树中找并复制）
          echo "Mapping missing DriverKit headers..."
          HEADERS="IOTypes.h IOReturn.h IORPC.h IOKitKeys.h IOKernelReportStructs.h IOReportTypes.h queue_implementation.h macro_help.h bounded_ptr.h bounded_array.h bounded_array_ref.h bounded_ptr_fwd.h OSBoundedArray.h OSBoundedArrayRef.h OSBoundedPtr.h OSBoundedPtrFwd.h safe_allocation.h"
          for h in $HEADERS; do
            if [ ! -f "iokit/DriverKit/$h" ]; then
              FOUND=$(find . -name "$h" | head -n 1)
              if [ -n "$FOUND" ]; then
                cp "$FOUND" "iokit/DriverKit/$h"
              fi
            fi
          done

      - name: Build XNU
        run: |
          make SDKROOT=macosx ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=DEVELOPMENT MACHINE_CONFIGS=BCM2837 RC_DARWIN_KERNEL_VERSION=23.6.0 RC_ProjectSourceVersion=10063.141.1

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel.development
          path: BUILD/obj/kernel.development
